name: BinanceTR AugSep 2026 OHLC
on:
  push:
    branches: [main]
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact Binance TR symbol types and klines
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error, datetime
          from decimal import Decimal, ROUND_HALF_EVEN

          TARGETS=["VIRTUAL","MMT","ORDI","EGLD","NEAR","FET","RENDER","INJ","UNI","SUI","WLD","ASTER","ETHFI","PENDLE","RAY","APT","ZRO"]
          START=datetime.datetime(2026,8,1,tzinfo=datetime.timezone.utc)
          END=datetime.datetime(2026,10,1,tzinfo=datetime.timezone.utc)
          START_MS=int(START.timestamp()*1000)
          END_MS=int(END.timestamp()*1000)-1

          def http_json(url):
              req=urllib.request.Request(url,headers={
                "User-Agent":"Mozilla/5.0",
                "Accept":"application/json,text/plain,*/*",
                "Accept-Language":"tr-TR,tr;q=0.9,en;q=0.8",
                "Referer":"https://www.binance.tr/"
              })
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read().decode("utf-8","replace")
                      return r.status,json.loads(body),body[:300]
              except urllib.error.HTTPError as e:
                  body=e.read().decode("utf-8","replace")
                  return e.code,None,body[:500]
              except Exception as e:
                  return -1,None,repr(e)

          st,symobj,raw=http_json("https://www.binance.tr/open/v1/common/symbols")
          print("SYMBOLS_ENDPOINT",st,raw)
          symlist=[]
          if st==200 and isinstance(symobj,dict):
              d=symobj.get("data")
              if isinstance(d,dict): symlist=d.get("list") or []
              elif isinstance(d,list): symlist=d

          meta={}
          for x in symlist:
              if not isinstance(x,dict): continue
              sym=x.get("symbol")
              if sym:
                  meta[sym]=x

          def parse_kline_payload(obj):
              if isinstance(obj,list): return obj
              if isinstance(obj,dict):
                  d=obj.get("data")
                  if isinstance(d,list): return d
                  if isinstance(d,dict):
                      for k in ("list","rows"):
                          if isinstance(d.get(k),list): return d[k]
              return []

          def fetch_type1(base):
              q=urllib.parse.urlencode({
                "symbol":base+"TRY",
                "interval":"1d",
                "startTime":START_MS,
                "endTime":END_MS,
                "limit":1000
              })
              urls=[
                "https://data-api.binance.vision/api/v3/klines?"+q,
                "https://api.binance.me/api/v1/klines?"+q,
              ]
              for url in urls:
                  st,obj,raw=http_json(url)
                  rows=parse_kline_payload(obj) if obj is not None else []
                  print("FETCH1",base,st,len(rows),url,raw)
                  if st==200 and rows: return rows,url
              return [],None

          def fetch_type3(symbol):
              q=urllib.parse.urlencode({
                "symbol":symbol,
                "interval":"1d",
                "startTime":START_MS,
                "endTime":END_MS,
                "limit":1000
              })
              url="https://cloudme-tr.2meta.app/api/v1/klines?"+q
              st,obj,raw=http_json(url)
              rows=parse_kline_payload(obj) if obj is not None else []
              print("FETCH3",symbol,st,len(rows),url,raw)
              return rows,url if rows else None

          def monthly(rows):
              out={}
              for r in rows:
                  if not isinstance(r,list) or len(r)<5: continue
                  ts=int(r[0])
                  while ts>9999999999999: ts//=1000
                  dt=datetime.datetime.fromtimestamp(ts/1000,datetime.timezone.utc)
                  ym=f"{dt.year:04d}-{dt.month:02d}"
                  if ym not in ("2026-08","2026-09"): continue
                  o,h,l,c=map(Decimal,[str(r[1]),str(r[2]),str(r[3]),str(r[4])])
                  if ym not in out:
                      out[ym]={"open":o,"low":l,"high":h,"close":c,"first":ts,"last":ts}
                  else:
                      d=out[ym]
                      if ts<d["first"]: d["open"]=o; d["first"]=ts
                      if l<d["low"]: d["low"]=l
                      if h>d["high"]: d["high"]=h
                      if ts>d["last"]: d["close"]=c; d["last"]=ts
              return out

          def rnd(d):
              return str(int(d.quantize(Decimal("1"),rounding=ROUND_HALF_EVEN)))

          print("===RESULT_BEGIN===")
          for base in TARGETS:
              symbol=base+"_TRY"
              m=meta.get(symbol)
              typ=m.get("type") if m else None
              print("@@@",base,"symbol",symbol,"type",typ,"found",bool(m))
              rows=[]; src=None
              if typ==1:
                  rows,src=fetch_type1(base)
              elif typ in (2,3):
                  rows,src=fetch_type3(symbol)
              else:
                  # Diagnostic fallbacks only; if symbols endpoint failed/missing.
                  r1,s1=fetch_type1(base)
                  if r1: rows,src=r1,s1
                  else:
                      rows,src=fetch_type3(symbol)
              mm=monthly(rows)
              for ym in ("2026-08","2026-09"):
                  d=mm.get(ym)
                  if d:
                      print("|".join([base,ym,rnd(d["open"]),rnd(d["low"]),rnd(d["high"]),rnd(d["close"]),str(typ),src or ""]))
                  else:
                      print("|".join([base,ym,"YOK","YOK","YOK","YOK",str(typ),src or ""]))
          print("===RESULT_END===")
          PY

# trigger
