name: BinanceTR OHLC temp
on:
  push:
    branches: [main]
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Binance market-data-only klines
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error, datetime
          from decimal import Decimal

          START=datetime.datetime(2024,1,1,tzinfo=datetime.timezone.utc)
          END=datetime.datetime(2026,8,1,tzinfo=datetime.timezone.utc)
          START_MS=int(START.timestamp()*1000)
          END_MS=int(END.timestamp()*1000)-1
          assets={"FET":["FET"],"RENDER":["RNDR","RENDER"],"INJ":["INJ"],"ORDI":["ORDI"],"UNI":["UNI"],"AVAX":["AVAX"]}

          def fetch(alias):
              q=urllib.parse.urlencode({"symbol":alias+"TRY","interval":"1d","startTime":START_MS,"endTime":END_MS,"limit":1000})
              url="https://data-api.binance.vision/api/v3/klines?"+q
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read().decode("utf-8","replace")
                      x=json.loads(b)
                      print("FETCH",alias,r.status,len(x),url)
                      return x if isinstance(x,list) else []
              except urllib.error.HTTPError as e:
                  b=e.read().decode("utf-8","replace")
                  print("HTTPERR",alias,e.code,b[:500],url); return []
              except Exception as e:
                  print("ERR",alias,repr(e),url); return []

          raw={}
          for coin,aliases in assets.items():
              bag=[]
              for alias in aliases:
                  for row in fetch(alias):
                      if isinstance(row,list) and len(row)>=5:
                          bag.append((int(row[0]),alias,row))
              by={}
              for ts,alias,row in bag:
                  old=by.get(ts)
                  if old is None or alias=="RENDER":
                      by[ts]=(alias,row)
              raw[coin]=[v[1] for _,v in sorted(by.items())]

          def monthly(rows):
              out={}
              for r in rows:
                  ts=int(r[0]); dt=datetime.datetime.fromtimestamp(ts/1000,datetime.timezone.utc)
                  ym=f"{dt.year:04d}-{dt.month:02d}"
                  o,h,l,c=map(Decimal,[str(r[1]),str(r[2]),str(r[3]),str(r[4])])
                  if ym not in out: out[ym]=[o,h,l,c,ts,ts]
                  else:
                      d=out[ym]
                      if ts<d[4]: d[0]=o; d[4]=ts
                      d[1]=max(d[1],h); d[2]=min(d[2],l)
                      if ts>d[5]: d[3]=c; d[5]=ts
              return out

          def fmt(x):
              s=format(x,"f")
              return s.rstrip("0").rstrip(".") if "." in s else s

          months=[]; y,m=2024,1
          while (y,m)<=(2026,7):
              months.append(f"{y:04d}-{m:02d}")
              y,m=(y+1,1) if m==12 else (y,m+1)

          print("===RESULT_BEGIN===")
          for coin in ["FET","RENDER","INJ","ORDI","UNI","AVAX"]:
              mm=monthly(raw.get(coin,[]))
              print("@@@",coin,"daily",len(raw.get(coin,[])),"months",len(mm))
              for ym in months:
                  d=mm.get(ym)
                  if d: print("|".join([coin,ym,fmt(d[0]),fmt(d[1]),fmt(d[2]),fmt(d[3])]))
                  else: print("|".join([coin,ym,"YOK","YOK","YOK","YOK"]))
          print("===RESULT_END===")
          PY
